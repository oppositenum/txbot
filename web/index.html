<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>txbot · 天下农场托管</title>
<style>
:root{--bg:#0f1115;--card:#191c23;--card2:#20242e;--line:#2a2f3a;--txt:#e8eaf0;--dim:#8b93a5;--acc:#4ade80;--warn:#fbbf24;--err:#f87171;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:17px;font-weight:600}h1 span{color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#08260f;font-weight:600}
.btn.d{color:var(--err);border-color:#3a2a2a}
.btn.s{padding:5px 10px;font-size:12px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:16px;font-weight:600}
.meta{color:var(--dim);font-size:12px;margin-top:2px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--dim)}
.chip.on{background:#12351f;color:var(--acc)}.chip.run{background:#332b12;color:var(--warn)}.chip.err{background:#3a1c1c;color:var(--err)}
.stats{display:flex;gap:14px;margin:10px 0 4px;font-size:13px;color:var(--dim)}
.stats b{color:var(--txt);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:20px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:var(--dim);border-radius:50%;transition:.2s}
.sw input:checked+i{background:#12351f;border-color:var(--acc)}
.sw input:checked+i:before{transform:translateX(20px);background:var(--acc)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px;border:1px solid var(--line)}
.sheet h2{font-size:16px;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
.f input[type=text],.f input[type=number],.f textarea,.f select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:14px}
.f textarea{min-height:90px;font-family:monospace;font-size:12px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border:none}
.opt .t{font-size:14px}.opt .st{font-size:11px;color:var(--dim)}
.logs{font:11px/1.7 ui-monospace,monospace;background:#0c0e12;border-radius:8px;padding:10px;max-height:50vh;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:#a8b3c7}
.empty{text-align:center;color:var(--dim);padding:60px 0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#252a35;border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:86vw}
.toast.show{opacity:1}
.fab{position:fixed;right:20px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#08260f;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(74,222,128,.35);z-index:20}
.sheetacts{display:flex;gap:10px;margin-top:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--card2);color:var(--dim);border-radius:8px;font-size:13px;cursor:pointer}
.tab.on{background:#12351f;border-color:var(--acc);color:var(--acc);font-weight:600}
.sheetacts .btn{flex:1;padding:11px;text-align:center;font-size:14px}
.landgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px}
.land{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;color:var(--dim)}
.land b{display:block;color:var(--txt);font-size:12px}
.land.ok{border-color:var(--acc)}.land.ok b{color:var(--acc)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.subtab{padding:5px 10px;font-size:12px;border:1px solid var(--line);background:var(--card2);color:var(--dim);border-radius:16px;cursor:pointer}
.subtab.on{background:#1a2740;border-color:var(--blue);color:var(--blue)}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:var(--card2);border:1px solid var(--line);border-radius:8px;margin-bottom:7px}
.li .n{font-size:13px}.li .n small{color:var(--dim);font-size:11px}
.li .r{display:flex;align-items:center;gap:6px}
.li input{width:56px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 7px;font-size:12px;text-align:center}
.gInfo{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--dim);margin-bottom:10px}
.gInfo b{color:var(--txt)}
.hint{color:var(--dim);font-size:12px;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>tx<span>bot</span> · 农场托管</h1>
  <div style="display:flex;gap:8px">
    <button class="btn s" onclick="openSettings()">设置</button>
    <button class="btn s" onclick="loadAccounts()">刷新</button>
  </div>
</header>
<main id="list"><div class="empty">加载中…</div></main>
<button class="fab" onclick="openAdd()">+</button>

<!-- 添加/编辑账号 -->
<div class="mask" id="mAdd"><div class="sheet">
  <h2 id="addTitle">添加账号</h2>
  <div class="f"><label>备注名（可留空）</label><input type="text" id="aName" placeholder="例如：大号"></div>
  <div class="f"><label>代理（可选，http://[user:pass@]host:port）</label><input type="text" id="aProxy" placeholder="留空则直连；该账号所有协议请求走此代理"></div>
  <div class="tabs" id="addTabs">
    <button class="tab on" data-m="creds" onclick="switchMode('creds')">账号密码</button>
    <button class="tab" data-m="cookie" onclick="switchMode('cookie')">Cookie</button>
  </div>
  <div id="mCreds">
    <div class="f"><label>账号（天下号/手机号/邮箱）</label><input type="text" id="aUid" placeholder="例如：12345678"></div>
    <div class="f"><label>密码</label><input type="text" id="aPwd" placeholder="登录密码"></div>
    <div class="meta" style="color:var(--dim);font-size:12px;margin-bottom:8px">保存时会立即验证登录；Cookie 失效后系统会用账密自动重登。</div>
  </div>
  <div id="mCookieBox" style="display:none">
    <div class="f"><label>Cookie（浏览器登录后复制，需含 JSESSIONID）</label>
      <textarea id="aCookie" placeholder="JSESSIONID=xxx; txuid=xxx; txEncodeUid=xxx; ..."></textarea></div>
  </div>
  <div class="sheetacts"><button class="btn" onclick="hide('mAdd')">取消</button><button class="btn p" id="saveBtn" onclick="saveAccount()">保存并登录</button></div>
</div></div>

<!-- 全局设置 -->
<div class="mask" id="mSet"><div class="sheet">
  <h2>全局设置 · 负载均衡</h2>
  <div class="grid2">
    <div class="f"><label>最大并发账号数</label><input type="number" id="sMax" min="1" max="64"></div>
    <div class="f"><label>调度扫描间隔(秒)</label><input type="number" id="sTick" min="5"></div>
    <div class="f"><label>每日任务开始(时:分)</label><div style="display:flex;gap:6px"><input type="number" id="sHour" min="0" max="23" style="width:50%"><input type="number" id="sMin" min="0" max="59" style="width:50%"></div></div>
    <div class="f"><label>每日错峰范围(分钟)</label><input type="number" id="sSpread" min="0"></div>
  </div>
  <div class="hint">并发数越小对服务器越友好；几百账号建议 5–10，配合错峰避免同时打请求。</div>
  <div class="f"><label>偷菜白名单（全局，这些 uid 不偷；逗号/空格/换行分隔）</label>
    <textarea id="sWhite" placeholder="例如：1225 3777 51013" style="min-height:70px"></textarea></div>
  <div class="sheetacts"><button class="btn" onclick="hide('mSet')">取消</button><button class="btn p" onclick="saveSettings()">保存</button></div>
</div></div>

<!-- 任务配置 -->
<div class="mask" id="mCfg"><div class="sheet">
  <h2>任务配置 · <span id="cfgName"></span></h2>
  <div id="cfgOpts"></div>
  <div class="grid2" style="margin-top:12px">
    <div class="f"><label>农场巡检间隔(分钟)</label><input type="number" id="cPoll" min="2"></div>
    <div class="f"><label>种植种子</label><select id="cSeed"><option value="auto">自动（数量最多）</option></select></div>
    <div class="f"><label>偷菜上限(0=不限,偷完为止)</label><input type="number" id="cStealMax" min="0"></div>
    <div class="f"><label>助友上限(0=不限,全部干完)</label><input type="number" id="cCareMax" min="0"></div>
    <div class="f"><label>牧场巡检间隔(分钟)</label><input type="number" id="cPastureInt" min="10"></div>
    <div class="f"><label>拓荒场景</label><select id="cPioScene"><option value="1">野猪林</option><option value="2">九寨沟</option><option value="3">西双版纳</option></select></div>
    <div class="f"><label>拓荒类型</label><select id="cPioAction"><option value="1">优质木材(30分)</option><option value="2">干草(30分)</option><option value="3">石块(50分)</option><option value="4">兽骨(10分)</option></select></div>
  </div>
  <div class="grid2">
    <div class="f"><label>抢积分·房间号(ar1)</label><input type="number" id="cGrabRoom"></div>
    <div class="f"><label>抢积分·每天开始(时:分)</label><div style="display:flex;gap:6px"><input type="number" id="cGrabHour" min="0" max="23" style="width:50%"><input type="number" id="cGrabMin" min="0" max="59" style="width:50%"></div></div>
    <div class="f"><label>抢积分·突发时长(分钟)</label><input type="number" id="cGrabWin" min="1"></div>
    <div class="f"><label>抢积分·轮询间隔(秒)</label><input type="number" id="cGrabPoll" min="2"></div>
  </div>
  <div class="f"><label>宠物培养属性(可多选，轮换培养；某个练不了自动换下一个)</label>
    <div id="cPetTrainWts" style="display:flex;flex-wrap:wrap;gap:8px">
      <label class="subtab"><input type="checkbox" value="3" style="margin-right:4px">智慧(加工)</label>
      <label class="subtab"><input type="checkbox" value="2" style="margin-right:4px">斗志(采集)</label>
      <label class="subtab"><input type="checkbox" value="1" style="margin-right:4px">气质(种花)</label>
      <label class="subtab"><input type="checkbox" value="4" style="margin-right:4px">体贴(料理)</label>
    </div></div>
  <div class="hint">农场按作物成熟时间精确唤醒；兜底上限用于捕捉别人帮浇水/被偷导致的提前成熟。</div>
  <div class="sheetacts"><button class="btn" onclick="hide('mCfg')">取消</button><button class="btn p" onclick="saveCfg()">保存本号</button></div>
  <div class="sheetacts" style="margin-top:8px">
    <button class="btn" onclick="saveCfgAsDefault()">设为新账号默认</button>
    <button class="btn" style="border-color:var(--blue);color:var(--blue)" onclick="applyCfgToAll()">应用到所有账号</button>
  </div>
  <div class="hint">「设为新账号默认」：以后新加的号自动用这套配置。「应用到所有账号」：把这套配置一键推给现有全部账号(不改各号启用开关/代理)。</div>
</div></div>

<!-- 详情/操作控制台 -->
<div class="mask" id="mDet"><div class="sheet">
  <div class="row" style="margin-bottom:12px"><h2 id="detName" style="margin:0"></h2><button class="btn s" onclick="hide('mDet')">关闭</button></div>
  <div class="tabs" id="detTabs">
    <button class="tab on" data-t="farm" onclick="detTab('farm')">农场</button>
    <button class="tab" data-t="pasture" onclick="detTab('pasture')">牧场</button>
    <button class="tab" data-t="pet" onclick="detTab('pet')">宠物</button>
    <button class="tab" data-t="gold" onclick="detTab('gold')">圣衣</button>
    <button class="tab" data-t="logs" onclick="detTab('logs')">日志</button>
  </div>
  <div id="tabBody"></div>
</div></div>

<!-- 签到 -->
<div class="mask" id="mSign"><div class="sheet">
  <h2>每日签到</h2>
  <div class="f" style="text-align:center"><img id="capImg" style="height:44px;border-radius:6px;background:#fff" alt="验证码"><div class="st" style="color:var(--dim);font-size:12px;margin-top:4px">点击图片可刷新</div></div>
  <div class="f"><label>验证码（4位）</label><input type="text" id="capIn" maxlength="4" inputmode="numeric" style="text-align:center;font-size:20px;letter-spacing:8px"></div>
  <div class="sheetacts"><button class="btn" onclick="hide('mSign')">取消</button><button class="btn p" onclick="doSignin()">领取奖励</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
let accounts = [], curId = null, curRegkey = null, logTimer = null;
const $ = (s) => document.querySelector(s);
const api = async (p, opt) => {
  const r = await fetch('/api' + p, opt ? { headers: {'Content-Type':'application/json'}, ...opt, body: opt.body ? JSON.stringify(opt.body) : undefined } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); };
const show = (id) => $('#' + id).classList.add('show');
const hide = (id) => $('#' + id).classList.remove('show');
const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

const FEATURES = [
  ['harvest','一键收割','成熟果实自动收'],['dig','一键耕地','收完自动翻地'],['sow','自动种植','空地自动播种'],
  ['weed','除草','自家土地'],['kill','杀虫','自家土地'],['water','浇水','自家土地'],['muck','施肥','需游戏内开通'],
  ['friendLand','友情地收割','收自己的友情地'],['steal','偷好友菜','按排行偷成熟作物'],
  ['careFriends','帮好友护理','除草/杀虫/浇水'],['sellAll','自动全售','卖掉未锁定果实⚠️'],
  ['pastureDaily','牧场每日','每日礼包+收获(每天一次)'],['petDaily','宠物每日','每日报道津贴(每天一次)'],
  ['goldDaily','圣衣每日','每日奖励宝箱(每天一次)'],['pastureLoop','牧场定时收获','按间隔巡检收获圈舍'],
  ['pioneer','神殿拓荒','定时发起拓荒(到点自动掉落)'],
  ['sowAutoBuy','库存不足自动购种','指定种子没库存时自动去商店买够'],
  ['farmSignin','农场签到','每日自动签到(OCR验证码)'],['groupSignin','群组签到','每日自动签到(OCR验证码)'],['qqSignin','QQ签到','每日自动签到'],
  ['petTrain','宠物培养','定时循环培养指定属性'],
  ['grabPoints','抢积分','每天定时突发抢聊天室字卡积分'],
];

function jobEnabledUI(a, type) {
  if (type === 'daily') return !!(a.config.pastureDaily || a.config.petDaily || a.config.goldDaily);
  return true;
}
function FarmClient_matureMin(text) {
  if (!text) return null;
  const h = +(text.match(/(\d+)\s*小时/) || [])[1] || 0;
  const m = +(text.match(/(\d+)\s*分钟/) || [])[1] || 0;
  return (h || m) ? h * 60 + m : null;
}
function fmtLeft(ts) {
  if (ts == null) return null;
  const ms = ts - Date.now();
  if (ms <= 0) return '可收';
  const m = Math.round(ms / 60000);
  return m >= 60 ? `${Math.floor(m / 60)}时${m % 60}分后` : `${m}分后`;
}
function overviewLine(st) {
  const parts = [];
  const f = st.farmInfo;
  if (f) parts.push(f.harvestable > 0 ? `农场 ${f.harvestable}块可收割` : (f.nextMatureAt ? `农场 ${fmtLeft(f.nextMatureAt)}成熟` : '农场 无作物'));
  const p = st.pastureInfo;
  if (p) {
    let ps;
    if (p.harvestable > 0) ps = `牧场 ${p.harvestable}可收获`;
    else if (p.needFeed > 0) ps = `牧场 ${p.needFeed}待喂食`;
    else if (p.idle > 0) ps = `牧场 ${p.idle}待补栏`;
    else if (p.nextMatureAt && p.nextMatureAt > Date.now()) ps = `牧场 ${fmtLeft(p.nextMatureAt)}成熟`;
    else ps = '牧场 生长中';
    parts.push(ps);
  }
  return parts.length ? `<div class="meta" style="color:var(--acc)">📊 ${parts.join(' · ')}</div>` : '';
}
function openBrowser(id) {
  // 用本地浏览器新标签，经服务端 cookie 注入代理以该账号身份浏览
  window.open('/b/' + id + '/plugins/farm/cs/index.do', '_blank');
}
async function openSettings() {
  try {
    const s = await api('/settings');
    $('#sMax').value = s.maxConcurrent; $('#sTick').value = s.tickSec; $('#sHour').value = s.dailyStartHour; $('#sMin').value = s.dailyStartMin ?? 6; $('#sSpread').value = s.dailySpreadMin;
    $('#sWhite').value = (s.stealWhitelist || []).join(' ');
    show('mSet');
  } catch (e) { toast(e.message); }
}
async function saveSettings() {
  const stealWhitelist = [...new Set(($('#sWhite').value.match(/\d+/g) || []).map(Number))];
  const body = { maxConcurrent: +$('#sMax').value || 5, tickSec: +$('#sTick').value || 20, dailyStartHour: +$('#sHour').value || 0, dailyStartMin: +$('#sMin').value || 0, dailySpreadMin: +$('#sSpread').value || 120, stealWhitelist };
  try { await api('/settings', { method: 'PUT', body }); hide('mSet'); toast('设置已保存(白名单' + stealWhitelist.length + '人)'); } catch (e) { toast(e.message); }
}
async function addWhite(uid, name) {
  try {
    const s = await api('/settings');
    const wl = new Set((s.stealWhitelist || []).map(Number)); wl.add(+uid);
    await api('/settings', { method: 'PUT', body: { stealWhitelist: [...wl] } });
    toast('已加入白名单: ' + (name || uid));
  } catch (e) { toast(e.message); }
}

async function loadAccounts() {
  try { accounts = await api('/accounts'); } catch (e) { toast('加载失败: ' + e.message); return; }
  const el = $('#list');
  if (!accounts.length) { el.innerHTML = '<div class="empty">还没有账号<br>点右下角 + 添加，粘贴登录 Cookie 即可</div>'; return; }
  el.innerHTML = accounts.map((a) => {
    const st = a.status || {};
    const chip = st.needLogin ? '<span class="chip err">Cookie失效</span>'
      : st.state === 'running' ? '<span class="chip run">执行中</span>'
      : a.config.enabled ? '<span class="chip on">托管中</span>' : '<span class="chip">已暂停</span>';
    const feats = FEATURES.filter(([k]) => a.config[k]).map(([,n]) => n).join('·') || '未配置任务';
    const jobs = st.jobs || {};
    const nextT = (t) => t ? new Date(t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '—';
    return `<div class="card">
      <div class="row">
        <div><span class="name">${esc(a.name)}</span> ${chip}
          <div class="meta">${st.level ? `Lv.${st.level} · 金币 ${Number(st.coin).toLocaleString()}` : '未同步'}${a.proxy ? ' · 🌐代理' : ''}</div>
        </div>
        <label class="sw"><input type="checkbox" ${a.config.enabled ? 'checked' : ''} onchange="toggle('${a.id}',this.checked)"><i></i></label>
      </div>

async function saveAccount() {
  const name = $('#aName').value.trim();
  const proxy = $('#aProxy').value.trim();
  let body;
  if (addMode === 'creds') {
    const useruid = $('#aUid').value.trim(), password = $('#aPwd').value;
    if (!useruid || !password) return toast('请输入账号和密码');
    body = { name, useruid, password, proxy };
  } else {
    const cookie = $('#aCookie').value.trim();
    if (!cookie && !curId) return toast('请粘贴 Cookie');
    body = { name, proxy };
    if (cookie) body.cookie = cookie;
  }
  const btn = $('#saveBtn'); btn.textContent = '登录中…'; btn.disabled = true;
  try {
    if (curId) await api('/accounts/' + curId, { method: 'PUT', body });

    hide('mAdd'); toast(curId ? '已更新' : '添加成功'); loadAccounts();

      }
    }
    else $('#pgInfo').innerHTML = `圣衣 <b>Lv${i.level}</b> · 铜币 <b>${Number(i.coin||0).toLocaleString()}</b> · ${esc(i.hp||'')} · 小宇宙 ${i.cosmos||0}`;
  } catch (e) { $('#pgInfo').innerHTML = `<span style="color:var(--err)">状态加载失败: ${esc(e.message)}</span>`; }
}
async function pastureHarvestEach() {
  try {
    const r = await api('/accounts/' + curId + '/plugin/pasture', { method: 'POST', body: { type: 'info' } });
    const ids = (r.result || {}).harvestable || [];
    if (!ids.length) return toast('无可收获圈舍');
    toast(`收获 ${ids.length} 个圈舍…`);
    for (const id of ids) await api('/accounts/' + curId + '/plugin/pasture', { method: 'POST', body: { type: 'harvest', id } });
    toast('收获完成'); renderPlugin('pasture');
  } catch (e) { toast('失败: ' + e.message); }
}
async function openSignin() {
  try {
    const s = await api('/accounts/' + curId + '/signin');
    curRegkey = s.regkey;
    $('#capImg').src = s.img ? '/api/accounts/' + curId + '/captcha-img?url=' + encodeURIComponent(s.img) : '';
    $('#capImg').onclick = openSignin;
    $('#capIn').value = ''; show('mSign');
  } catch (e) { toast('获取验证码失败: ' + e.message); }
}
async function doSignin() {
  try { const r = await api('/accounts/' + curId + '/signin', { method: 'POST', body: { regkey: curRegkey, authnum: $('#capIn').value.trim() } }); hide('mSign'); toast(r.result || '完成'); }
  catch (e) { toast('签到失败: ' + e.message); }
}

document.querySelectorAll('.mask').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('show'); }));
loadAccounts();
setInterval(loadAccounts, 15000);
</script>
</body>
